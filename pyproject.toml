[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-jboss-agent"
version = "0.2.0"
description = "Learning project for LangGraph, MCP, HITL, and JBoss incident response"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langgraph>=1.1.5,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain>=1,<2",
  "langchain-google-genai>=4,<5",
  "langchain-mcp-adapters==0.3.2",
  # langchain-mcp-adapters 0.3.2 currently requires the MCP Python SDK 1.x API.
  # Do not remove <2 until the adapter adds MCP SDK 2.x compatibility.
  "mcp[cli]>=1.24,<2",
  "streamlit>=1.45",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "apscheduler>=3.11,<4",
]

[project.scripts]
jboss-agent-gemini-ping = "jboss_agent.cli.gemini_ping:main"
jboss-agent-step1 = "jboss_agent.cli.step1:main"
jboss-agent-step2 = "jboss_agent.cli.step2:main"
jboss-agent-step3 = "jboss_agent.cli.step3:main"
jboss-agent-step4 = "jboss_agent.cli.step4:main"
jboss-agent-step5 = "jboss_agent.cli.step5:main"
jboss-agent-step6 = "jboss_agent.cli.step6:main"
jboss-agent-step7 = "jboss_agent.cli.step7:main"
jboss-agent-step8 = "jboss_agent.cli.step8:main"
jboss-agent-step9 = "jboss_agent.cli.step9:main"
jboss-agent-step10 = "jboss_agent.cli.step10:main"
jboss-agent-step12 = "jboss_agent.cli.step12:main"
jboss-agent-fake-mcp = "jboss_agent.mcp_server.fake_jboss_server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
ignore = ["EXE002"]  # 実行権限があるのにシバンがない警告を無視
